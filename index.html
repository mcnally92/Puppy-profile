<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>재성 · 강아지 유치원 지원서</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light only">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#FFFFFF; --card:#FFFCF6;
  --ink:#4A3226;      /* 진한 웜브라운 - 제목 */
  --ink2:#6B5344;     /* 본문 */
  --pencil:#A98A6E;   /* 보조 설명 */
  --dash:#EBDDC9;     /* 점선 */
  --crayon:#E39247; --mustard:#F0B23F; --brick:#C1573A; --cocoa:#8B5E3C;
}
html,body{background:#FFFFFF !important;background-color:#FFFFFF !important;color-scheme:light only}
#page{background:#FFFFFF !important;min-height:100vh;position:relative;z-index:0}
@media (prefers-color-scheme:dark){
  html,body,#page{background:#FFFFFF !important;background-color:#FFFFFF !important}
  body{color:#6B5344 !important}
  h1,h2,.rname,.sh-name,.close{color:#4A3226 !important}
  .role{color:#C1573A !important}
  .eyebrow,.tag,.rsub,.hint,.thanks,.sh-sub{color:#A98A6E !important}
  .note{background:#FFFCF6 !important;color:#6B5344 !important}
  #sheet{background:#FFFFFF !important}
  .facts b{color:#8B5E3C !important}
  .li{color:#6B5344 !important}
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#FFFFFF; color:var(--ink2); min-height:100vh; padding-bottom:52px;
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; overflow-x:hidden;
}
.col{max-width:430px;margin:0 auto;padding:0 22px}
.dash{height:0;border-top:2px dashed var(--dash);margin:30px 0}

/* ── 등장 모션 ── */
.rise{opacity:0;animation:rise .72s cubic-bezier(.2,.9,.3,1.15) forwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.pop{opacity:0;animation:pop .62s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-18deg)}
  60%{opacity:1;transform:scale(1.18) rotate(5deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.draw{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .8s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes wag{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes spin{from{transform:rotate(-10deg);opacity:.9}to{transform:rotate(360deg);opacity:0}}

/* ── 헤더 ── */
header{padding:28px 0 0;text-align:center}
.dogwrap{width:152px;margin:0 auto;animation:pop .8s cubic-bezier(.34,1.56,.64,1) forwards;opacity:0}
.dog{width:152px;height:152px;display:block;transform:rotate(-3deg)}
#tail{transform-box:fill-box;transform-origin:14% 86%;animation:wag 1.15s ease-in-out infinite}
.eyebrow{font-family:Gaegu,sans-serif;font-size:17px;color:var(--pencil)}
h1{font-family:Gaegu,sans-serif;font-size:54px;font-weight:700;line-height:.95;color:var(--ink);margin-top:4px}
.role{font-family:Gaegu,sans-serif;font-size:22px;color:var(--brick);margin-top:2px}
.tag{font-size:14px;color:var(--pencil);margin-top:14px;line-height:1.7}

h2{font-family:Gaegu,sans-serif;font-size:27px;font-weight:700;color:var(--ink)}
.hint{font-size:12.5px;color:var(--pencil);margin:2px 0 24px;display:flex;align-items:center;gap:5px}
.hint svg{width:15px;height:15px;color:var(--crayon);animation:bob 1.5s ease-in-out infinite}

/* ── 차트 ── */
svg.chart{display:block;margin:0 auto;overflow:visible}
.lbl{cursor:pointer;opacity:0}
.lbl text{fill:var(--cocoa);font-family:Gaegu,sans-serif;font-size:19px;font-weight:700}
.lbl.on text{fill:var(--brick)}
.dot{transform-box:fill-box;transform-origin:50% 50%;transition:r .25s cubic-bezier(.34,1.56,.64,1)}

/* ── 목록 ── */
.rows{margin-top:16px}
.row{width:100%;text-align:left;background:none;border:0;border-top:2px dashed var(--dash);
  padding:13px 2px;display:flex;align-items:center;gap:10px;color:inherit;cursor:pointer;font:inherit;
  opacity:0;animation:rise .6s cubic-bezier(.2,.9,.3,1.15) forwards}
.rows .row:last-child{border-bottom:2px dashed var(--dash)}
.row:focus-visible{outline:2px solid var(--brick);outline-offset:3px;border-radius:8px}
.row:active .rname{transform:scale(.96)}
.rname{font-family:Gaegu,sans-serif;font-size:22px;font-weight:700;color:var(--ink);min-width:62px;
  transition:transform .15s}
.rsub{font-size:11.5px;color:var(--pencil);flex:1;line-height:1.4}
.stars{flex:none;display:block;overflow:visible}
.st{opacity:0;animation:starIn .3s steps(1,end) forwards}
/* 하이글로시 : 밝은 띠가 별을 비스듬히 훑고 지나감 */
.gsweep{animation:glint var(--gd,2.8s) cubic-bezier(.4,0,.5,1) infinite both}
@keyframes glint{
  0%{transform:translateX(-30px)}
  20%{transform:translateX(34px)}
  100%{transform:translateX(34px)}}
/* 뾰로롱 : 띠가 빠져나가는 순간 튀는 반짝 */
.twk{transform-box:fill-box;transform-origin:50% 50%;opacity:0;
  animation:twink var(--gd,2.8s) linear infinite both}
@keyframes twink{
  0%,8%{opacity:0;transform:scale(0) rotate(-20deg)}
  14%{opacity:1;transform:scale(1.25) rotate(15deg)}
  20%{opacity:.85;transform:scale(.62) rotate(38deg)}
  27%,100%{opacity:0;transform:scale(0) rotate(55deg)}}
@keyframes starIn{0%{opacity:0}34%{opacity:.45}67%{opacity:.8}100%{opacity:1}}
.chev{color:var(--dash);font-size:18px}


/* ── 카드 / 정보 ── */
.note{background:var(--card);border:2px solid var(--ink);border-radius:22px 8px 24px 10px;
  padding:18px 20px;font-size:14px;line-height:1.8;transform:rotate(-.6deg);color:var(--ink2)}
.facts div{display:flex;padding:10px 2px;font-size:13.5px;border-bottom:2px dashed var(--dash)}
.facts div:last-child{border-bottom:0}
.facts span{flex:1;min-width:0}
.facts b{width:88px;color:var(--cocoa);font-family:Gaegu,sans-serif;font-size:18px;font-weight:700;
  white-space:nowrap;flex:none}
.paws{text-align:center;margin-top:36px}
.paws svg{width:24px;height:24px;margin:0 6px;animation:bob 1.4s ease-in-out infinite}
.thanks{font-family:Gaegu,sans-serif;font-size:21px;color:var(--pencil);text-align:center;margin-top:6px}

/* ── 상세 시트 ── */
#scrim{position:fixed;inset:0;background:rgba(74,50,38,.3);opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:4}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:3px solid var(--ink);
  border-radius:28px 28px 0 0;transform:translateY(102%);
  transition:transform .4s cubic-bezier(.2,1.1,.3,1);max-width:430px;margin:0 auto;
  padding:16px 24px 34px;max-height:84vh;overflow-y:auto;z-index:5}
#sheet.on{transform:translateY(0)}
.grab{width:44px;height:4px;background:var(--dash);border-radius:3px;margin:0 auto 16px}
.art{width:156px;height:134px;margin:2px auto 8px;display:block}
.art svg{width:156px;height:134px;display:block;overflow:visible}
.sh-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sh-name{font-family:Gaegu,sans-serif;font-size:34px;font-weight:700;line-height:1;color:var(--ink)}
.sh-sub{font-size:12px;color:var(--pencil);margin-top:3px}
.sh-head{font-size:14.5px;font-weight:600;line-height:1.7;margin:14px 0 8px;color:var(--ink)}
.li{display:flex;gap:9px;font-size:13.5px;line-height:1.7;color:var(--ink2);padding:6px 0;
  opacity:0;animation:rise .5s cubic-bezier(.2,.9,.3,1.15) forwards}
.li svg{flex:none;width:15px;height:15px;margin-top:4px;color:var(--crayon)}
.close{width:100%;margin-top:18px;padding:13px;background:none;border:2px solid var(--ink);
  border-radius:18px 6px 20px 8px;color:var(--ink);font-family:Gaegu,sans-serif;font-size:20px;
  font-weight:700;cursor:pointer}
.close:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-delay:0s!important;
    animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<svg id="lib" width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="crayon" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="crayonSoft" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <symbol id="paw" viewBox="0 0 24 24">
    <g fill="currentColor" filter="url(#crayonSoft)">
      <ellipse cx="12" cy="16" rx="6" ry="5"/><ellipse cx="5.5" cy="9.5" rx="2.6" ry="3.2"/>
      <ellipse cx="10" cy="6.5" rx="2.6" ry="3.4"/><ellipse cx="15" cy="6.5" rx="2.6" ry="3.4"/>
      <ellipse cx="19" cy="10" rx="2.6" ry="3.2"/>
    </g>
  </symbol>
</svg>

<div id="page">
<div class="col">
  <header>
    <div class="dogwrap">
      <svg class="dog" viewBox="0 0 200 200" width="152" height="152" aria-hidden="true">
        <g filter="url(#crayon)">
          <g id="tail"><path d="M144 158 C170 152 180 136 172 122" fill="none" stroke="#E39247"
            stroke-width="11" stroke-linecap="round"/></g>
          <path d="M62 46 C46 26 36 42 42 60 C46 72 58 78 66 73 Z" fill="#C97F35"/>
          <path d="M138 46 C154 26 164 42 158 60 C154 72 142 78 134 73 Z" fill="#C97F35"/>
          <path d="M100 112 C126 112 141 136 145 163 C147 177 140 182 127 182 L73 182 C60 182 53 177 55 163 C59 136 74 112 100 112 Z" fill="#E39247"/>
          <path d="M100 30 C133 30 147 53 147 77 C147 103 126 119 100 119 C74 119 53 103 53 77 C53 53 67 30 100 30 Z" fill="#EDA85A"/>

          <ellipse cx="120" cy="177" rx="11" ry="7.5" fill="#F5C283"/>
          <g stroke="#C97F35" stroke-width="3" stroke-linecap="round" opacity=".45" fill="none">
            <path d="M70 128 C66 140 64 152 65 166"/><path d="M86 124 C82 138 81 152 82 166"/>
            <path d="M118 124 C122 138 123 152 122 166"/><path d="M132 130 C136 142 137 153 136 166"/>
            <path d="M100 26 C98 18 104 16 106 24"/><path d="M110 28 C110 20 116 20 116 27"/>
            <path d="M90 28 C88 21 82 22 84 29"/>
          </g>
          <circle cx="85" cy="74" r="5" fill="#4A3226"/><circle cx="115" cy="74" r="5" fill="#4A3226"/>
          <path d="M100 84 C107 84 109 89 104 92 C101 94 99 94 96 92 C91 89 93 84 100 84 Z" fill="#4A3226"/>
          <path d="M100 93 C100 100 91 102 87 97" fill="none" stroke="#4A3226" stroke-width="3" stroke-linecap="round"/>

          <path d="M96 99 C96 110 106 110 104 99 Z" fill="#E0776F"/>

      </svg>
    </div>
    <div class="eyebrow rise" style="animation-delay:.3s" id="upd"></div>
    <h1 class="rise" style="animation-delay:.38s" id="nm"></h1>
    <div class="role rise" style="animation-delay:.5s" id="rl"></div>
    <p class="tag rise" style="animation-delay:.62s" id="tg"></p>
  </header>

  <div class="dash"></div>

  <h2 class="rise" style="animation-delay:.7s">제가 잘하는 것들</h2>
  <p class="hint rise" style="animation-delay:.76s">
    <svg width="15" height="15" viewBox="0 0 24 24"><use href="#paw"/></svg>누르면 왜 그런지 보여드려요</p>

  <svg class="chart" viewBox="0 0 300 296" width="100%" height="296" aria-label="능력치 그래프">
    <g id="grid"></g>
    <g id="sweep" style="transform-origin:150px 142px">
      <path d="M150 142 C152 110 149 70 150 36" fill="none" stroke="#C1573A" stroke-width="3" stroke-linecap="round"/>
    </g>
    <polygon id="poly" fill="rgba(227,146,71,.28)" stroke="#E39247" stroke-width="3.5"
             stroke-linejoin="round" filter="url(#crayonSoft)"/>

  </svg>

  <div class="rows" id="rows"></div>

  <div class="dash"></div>
  <h2 id="mt"></h2>
  <div class="note" id="mb" style="margin-top:12px"></div>

  <div class="dash"></div>
  <h2>기본 정보</h2>
  <div class="facts" id="facts" style="margin-top:8px"></div>

  <div class="dash"></div>
  <h2>경력사항</h2>
  <div class="rows" style="margin-top:8px">
    <button class="row" id="careerBtn" style="animation-delay:2.6s">
      <span class="rname">경력</span><span class="rsub">지금까지의 경험을 한눈에 보기</span><span class="chev">›</span>
    </button>
  </div>

  <div class="paws">
    <svg width="24" height="24" viewBox="0 0 24 24" style="color:#E39247;animation-delay:0s"><use href="#paw"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" style="color:#F0B23F;animation-delay:.18s"><use href="#paw"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" style="color:#C1573A;animation-delay:.36s"><use href="#paw"/></svg>
  </div>
  <p class="thanks">읽어주셔서 고맙습니다!</p>
</div>
</div>

<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>

<script>
/* ══════════════ 여기만 고치면 됩니다 ══════════════ */

const PROFILE = {
  name: "홍미혜",
  role: "마인드몽 유치원 알바 지원서",
  tagline: "꾸준히, 오랫동안 함께하고 싶습니다.",
  updated: "마인드몽",
  motiveTitle: "지원 동기",
  motive: "강아지들과 함께 일할 수 있다면 누구보다 열정적이고 즐겁게 일할 수 있어서 지원했습니다. 동물을 좋아해서 아이들의 기분이나 상태도 금방 눈치채는 편입니다. 아이들에게는 따뜻한 선생님, 보호자님들께는 믿음직한 알바생이 되도록 최선을 다하겠습니다.",
  facts: [
    ["나이", "1993년 10월 15일 · 만 32세"],
    ["집", "새터마을 힐스테이트 아파트 718동"],
    ["연락처", "010-2006-7060"],
    ["면허", "2종 보통 · 운전 경력 10년+ (자차 보유)"],
    ["근무 요일", "평일 전일 · 주말 협의"],
    ["반려 경험", "시로 · 장모치와와 · 15살 (현재 친언니와 거주) / 지금은 반려묘 두 마리와 함께 삽니다"]
  ]
};

/* stars: 0 ~ 5, 0.5 단위 */
const STATS = [
  { name:"체력", art:"run", sub:"하루 종일 놀아주기", stars:4,
    headline:"체력은 지금도 꾸준히 늘고 있고, 오래 버티는 근성은 이미 있습니다.",
    points:["주 5회 운동으로 체력을 꾸준히 늘리고 있습니다",
            "광고업계 조감독 출신으로 프로야근러였습니다"] },

  { name:"활력", art:"jump", sub:"나이 · 배우는 속도", stars:4,
    headline:"알려주시면 바로 몸에 붙이는 편입니다.",
    points:["만 32세 — 요즘 MZ들과는 다른 꼰대 마인드를 장착했습니다",
            "다른 사람들과 트러블 없는 밝은 성격이며 근무할 땐 꼼꼼하게 챙기는 편입니다",
            "오래 일할 생각으로 지원했습니다"] },

  { name:"기동력", art:"dash", sub:"집에서 유치원까지", stars:5,
    headline:"가까운 거리라 빠르게 갈 수 있습니다.",
    points:["집에서 마인드몽 유치원까지 604m, 차량으로 4분 거리입니다",
            "이사 걱정 없이 평생 근무할 수 있습니다"] },

  { name:"주도력", art:"broom", sub:"시키기 전에 하는 일", stars:4.5,
    headline:"눈에 보이는 일은 말 나오기 전에 해둡니다.",
    points:["주도적으로 생각하고 행동하는 편입니다",
            "눈치가 빨라 알아서 척척 한다는 말을 자주 들었습니다",
            "어떤 일이든 맡으면 책임감 있게 끝까지 해내려고 합니다"] },

  { name:"대응력", art:"alert", sub:"급한 일이 생겼을 때", stars:4.5,
    headline:"갑작스러운 호출에도 바로 대응할 수 있습니다.",
    points:["운동 시간 외에는 자유로워 바로 대응할 수 있습니다",
            "연락 확인은 평균 5분 이내에 가능합니다"] },

  { name:"주행력", art:"drive", sub:"등하원 차량 운행", stars:5,
    headline:"등하원 차량과 갑작스러운 병원 이동을 맡을 수 있습니다.",
    points:["2종 보통 취득 후 10년 이상 운전 경력이 있습니다",
            "자차를 보유하고 있습니다",
            "아이들 태울 때는 급정거·급회전 없는 운전이 기본이라고 생각합니다"] }

/* 경력사항 : 한눈에 보기 팝업에 쓰일 목록. 최신순으로 적어주세요 */
const CAREER = [
  { period:"2020.05 – 2021.07", place:"바로아이디", desc:"시계 브랜드 매장 집기 제작 및 인테리어 감리" },
  { period:"2019.08 – 2020.01", place:"그린컴퓨터아카데미 (실내건축설계 BIM 과정)", desc:"교육 이수 후 전산응용건축제도기능사 자격증 취득" },
  { period:"2017.10 – 2018.10", place:"CJ파워캐스트", desc:"방송 파일 인제스트 및 편집 업무" },
  { period:"2016.04 – 2017.05", place:"매시브크리에이티브", desc:"TVCF 조감독 업무" }
];

/* ══════════════ 아래는 건드릴 필요 없음 ══════════════ */

const CX=150, CY=142, R=104, N=6, NS="http://www.w3.org/2000/svg";
const REDUCE=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ══ 효과음: 통통 튀는 크레용 버블 사운드 (외부 파일 없이 합성) ══ */
let actx=null;
function ensureAudio(){
  if(!actx){
    try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if(actx.state==="suspended") actx.resume();

/* 짧은 사인 글리산도 한 번: f0→f1로 휘어 오르며 통 튕기는 소리 */
function blip(f0,f1,dur,vol,type,delay){
  const ctx=ensureAudio(); if(!ctx) return;
  const t=ctx.currentTime+(delay||0);
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type||"sine";
  o.frequency.setValueAtTime(Math.max(40,f0),t);
  o.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur*0.5);
  o.frequency.exponentialRampToValueAtTime(Math.max(40,f1*0.9),t+dur);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t+dur+0.03);
}
/* 아주 짧은 화이트노이즈 톡 — 버블 표면이 톡 터지는 질감 */
function pop(vol,delay){
  const ctx=ensureAudio(); if(!ctx) return;
  const t=ctx.currentTime+(delay||0), dur=.045;
  const buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const src=ctx.createBufferSource(); src.buffer=buf;
  const hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=1800;
  const g=ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(hp); hp.connect(g); g.connect(ctx.destination);
  src.start(t);
}
/* 항목 열기: "띠-용" 두 음으로 통통 튀어 오르는 버블 (항목마다 음높이가 살짝 달라 실로폰처럼 다양하게) */
function sfxOpen(seed){
  const base=480+((seed||0)*33)%260;
  pop(.09,0);
  blip(base*0.8, base*1.55, .10, .15, "sine", 0);
  blip(base*1.5, base*1.1,  .16, .12, "sine", .065);
}
/* 닫기: 낮고 짧은 통통 방울이 가라앉는 소리 */
function sfxClose(){
  pop(.06,0);
  blip(430,230,.13,.12,"sine",0);
}
/* 별 등장 등 아주 가벼운 톡 (필요시 재사용) */
function sfxTick(seed){
  blip(700+((seed||0)*17)%180, 900,.05,.06,"triangle",0);
}

function playArt(root,key){
  if(REDUCE) return;
  const gs=root.querySelectorAll(".af"); if(gs.length<2) return;
  const n=gs.length, seq=n>2?[0,1,2,1]:[0,1];
  let j=0;
  const step=()=>{
    if(!gs[0].isConnected) return;
    if(document.hidden){ setTimeout(step,400); return; }
    j=(j+1)%seq.length;
    gs.forEach((g,i)=>g.style.display=(i===seq[j]?"":"none"));
    setTimeout(step, ART_RATE[key]||160);
  };
  setTimeout(step, ART_RATE[key]||160);
}

function starsSVG(v,delay){
  const id="s"+(uid++); let out="";
  for(let i=0;i<5;i++){
    const f=Math.max(0,Math.min(1,v-i));
    const k=(Math.random()*DRAWINGS.length)|0;
    const D=DRAWINGS[k], R='" stroke-linecap="round" stroke-linejoin="round"/>';
    const gd=(2.2+Math.random()*1.9).toFixed(2);      /* 광택 주기 2.2~4.1초 */
    const gdl=(-Math.random()*4).toFixed(2);          /* 시작 시점을 흩뜨림 */
    let inner='<use class="uOut" href="#so'+k+'" fill="none" stroke="'+C_DIM+'" stroke-width="'+D.w+R;
    if(f>0){
      inner='<defs><clipPath id="'+id+'_'+i+'"><rect x="-4" y="-4" width="'+(f>=1?32:16)+
        '" height="32"/></clipPath></defs>'+inner+
        '<g clip-path="url(#'+id+'_'+i+')">'+
        '<use class="uScr" href="#ss'+k+'" fill="none" stroke="'+C_LIT+'" stroke-width="'+D.c+
        '" stroke-linecap="round" opacity=".92"/>'+
        '<use class="uEdge" href="#so'+k+'" fill="none" stroke="'+C_EDGE+'" stroke-width="'+(D.w+.2)+R+

/* ── 작화 재생 : 멈추는 구간 없이 계속 다음 장으로 넘어감 ──
   별마다 46~76ms 사이 난수 간격이라 30개가 절대 같은 박자로 안 맞음 */
function liven(root,startAfter){
  if(REDUCE) return;
  root.querySelectorAll(".stIn").forEach((n,i)=>{
    let last=+n.dataset.k;
    const step=()=>{
      if(!n.isConnected) return;                       /* 사라진 별은 재생 중단 */
      if(document.hidden){ setTimeout(step,400); return; }
      let k; do{ k=(Math.random()*DRAWINGS.length)|0; }while(k===last);
      last=k; drawTo(n,k);
      setTimeout(step, 46+Math.random()*30);
    };
    setTimeout(step, startAfter*1000+i*40+Math.random()*220);
  });
}

/* 상세 시트 */
const sheet=document.getElementById("sheet"), scrim=document.getElementById("scrim"),
      body=document.getElementById("sheetBody");

function openSheet(i){
  const s=STATS[i];
  body.innerHTML=
    artSVG(s.art)+
    '<div class="sh-top"><div><div class="sh-name"></div><div class="sh-sub"></div></div>'+
    starsSVG(s.stars,.12)+'</div><p class="sh-head"></p>'+
    s.points.map((_,k)=>'<div class="li" style="animation-delay:'+(.14+k*.08)+
      's"><svg width="15" height="15" viewBox="0 0 24 24"><use href="#paw"/></svg><span></span></div>').join("")+
    '<button class="close">닫기</button>';
  body.querySelector(".sh-name").textContent=s.name;
  body.querySelector(".sh-sub").textContent=s.sub;
  body.querySelector(".sh-head").textContent=s.headline;
  body.querySelectorAll(".li span").forEach((n,k)=>n.textContent=s.points[k]);
  playArt(body, s.art);
  liven(body, .8);
  body.querySelector(".close").addEventListener("click",()=>{sfxClose(); close();});
  sheet.classList.add("on"); scrim.classList.add("on");
  document.querySelectorAll(".lbl").forEach((g,k)=>g.classList.toggle("on",k===i));
  dots.forEach((d,k)=>d.setAttribute("r",k===i?8.5:5));
}
function close(){
  sheet.classList.remove("on"); scrim.classList.remove("on");
  document.querySelectorAll(".lbl").forEach(g=>g.classList.remove("on"));
  dots.forEach(d=>d.setAttribute("r",5));
}
scrim.addEventListener("click",()=>{sfxClose(); close();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){sfxClose(); close();}});

/* 경력사항 팝업 : 강아지 애니는 기존 art 중 하나(jump)를 재사용 */
function openCareer(){
  body.innerHTML =
    artSVG("jump")+
    '<div class="sh-top"><div><div class="sh-name">경력사항</div>'+
    '<div class="sh-sub">한눈에 보기</div></div></div>'+
    '<p class="sh-head">지금까지 쌓아온 경력입니다.</p>'+
    CAREER.map((_,k)=>'<div class="li" style="animation-delay:'+(.14+k*.08)+
      's"><svg width="15" height="15" viewBox="0 0 24 24"><use href="#paw"/></svg><span></span></div>').join("")+
    '<button class="close">닫기</button>';
  body.querySelectorAll(".li span").forEach((n,k)=>{
    const c=CAREER[k];
    n.textContent=c.period+" · "+c.place+" — "+c.desc;
  });
  playArt(body,"jump");
  liven(body,.8);
  body.querySelector(".close").addEventListener("click",()=>{sfxClose(); close();});
  sheet.classList.add("on"); scrim.classList.add("on");
}
document.getElementById("careerBtn").addEventListener("click",()=>{sfxOpen(99); openCareer();});
</script>
</body>
</html>
